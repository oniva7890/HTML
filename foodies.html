<!DOCTYPE html>
<html>
  <head>
    <title>Navbar</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }
      .topnav {
        overflow: hidden;
        background-color: #520202;
      }
      .topnav a {
        float: left;
        color: #ffffff;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }
      .topnav a:hover {
        background-color: #ddd;
        color: black;
      }
      .topnav a.active {
        background-color: #bd0303;
        color: rgb(0, 0, 0);
      }
    </style>
  </head>
  <body>
    <div class="topnav">
      <a class="active" href="#home">Home</a>
      <a href="#">About_Us</a>
      <a href="#">Gallery</a>
      <a href="#">Services</a>
      <a href="#">Offer</a>
      <a href="#">Contact_Us</a>
    </div>
  </body>
</html>
