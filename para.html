<html>
<head>
<style>


div{
right: 30px;
border: 3px solid darkred;
}

div.absoulte{
position: absoulte
left: 40px;
border:  3px solid yellow;


}

div.relative{
position: relative;
left: 100px;
border: 3px solid darkred;

}
div.fixed{
position: fixed;
top: 0;
right: 20px;
width: 300px;
border: 3px solid yellow;

}

div.sticky{
position:sticky
top: 1px;
left: 20px;

width: 100px;

border: 3px solid #73AD21;

}
</style>

</head>

<body>

<h2>POSITIONING</h2>

<div>

Div with no position property

</div>

<div class="sticky">

Div with sticky position property

</div>

<div class="relative">

This div element has position: relative;

<div class="absolute">

Absolute class DIV

</div>

</div>

<div class="fixed">

Div with fixed position property

</div>

<div style="height: 1800px; border: none;">

</div>

</body>

</html>
